<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CA Shorts">
<meta name="theme-color" content="#f6f4ef">
<title>CA Shorts</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<style>
:root{--bg:#f6f4ef;--card:#fff;--tx:#111;--mut:#7a7872;--ln:#e4e1da;--ink:#111;--inv:#fff;--soft:#f1efe9}
@media(prefers-color-scheme:dark){:root{--bg:#000;--card:#111;--tx:#f5f4f0;--mut:#8d8b85;--ln:#262626;--ink:#f5f4f0;--inv:#000;--soft:#1a1a1a}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{height:100%;height:100dvh;margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,'SF Pro Text',system-ui,sans-serif;overscroll-behavior:none}
#app{height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
header{display:flex;gap:6px;align-items:center;padding:10px 12px 8px}
header b{font-family:Georgia,'Times New Roman',serif;font-size:24px;font-weight:700;flex:1;white-space:nowrap;letter-spacing:-.5px}
#stk{font-weight:600;font-size:13px;border:1px solid var(--ln);border-radius:20px;padding:6px 11px;background:var(--card)}
button,select{background:var(--card);color:var(--tx);border:1px solid var(--ln);border-radius:999px;padding:8px 12px;font-size:13px;font-weight:600;max-width:30vw;font-family:inherit}
button:active{transform:scale(.96)}
button.p{background:var(--ink);color:var(--inv);border:0}
#pgw{height:2px;background:var(--ln);margin:0 14px}#pg{height:100%;width:0;background:var(--ink);transition:width .2s}
#feed{flex:1;overflow-y:auto;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch}
.c{height:100%;scroll-snap-align:start;scroll-snap-stop:always;padding:10px 12px 10px;display:flex}
.in{flex:1;border-radius:26px;overflow-y:auto;display:flex;flex-direction:column;background:var(--card);box-shadow:0 1px 0 var(--ln),0 10px 30px #0000001a}
.im{height:36%;min-height:160px;flex:none;position:relative;display:flex;align-items:center;justify-content:center;font-size:56px;background:var(--soft)}
.im img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.n{position:absolute;right:12px;top:12px;z-index:2;background:#fffffff0;color:#111;border-radius:999px;padding:5px 11px;font-size:12px;font-weight:600}
.tag{position:absolute;left:12px;top:12px;z-index:2;background:#111;color:#fff;border-radius:999px;padding:5px 12px;font-size:12px;font-weight:600;letter-spacing:.2px}
.bd{padding:16px 20px 12px;flex:1;display:flex;flex-direction:column}
h2{margin:0 0 6px;font-family:Georgia,'Times New Roman',serif;font-size:25px;line-height:1.18;font-weight:700;letter-spacing:-.4px}
.mt{font-size:12px;color:var(--mut);margin-bottom:10px;letter-spacing:.3px;text-transform:uppercase;font-weight:600}
p{margin:0 0 12px;font-size:15.5px;line-height:1.55;color:var(--tx)}
.rev{width:100%;max-width:none;padding:13px;font-size:14px;border:1.5px solid var(--ink);background:transparent;border-radius:999px}
.facts{margin-top:2px;animation:pop .3s}@keyframes pop{from{opacity:0;transform:translateY(8px)}}
ul{margin:2px 0 10px;padding:0;list-style:none}
li{margin-bottom:6px;font-size:14.5px;line-height:1.4;border-bottom:1px solid var(--ln);padding:7px 0}
li:before{content:"—";margin-right:8px;color:var(--mut)}
.kw{display:flex;flex-wrap:wrap;gap:6px}.kw span{border:1px solid var(--ln);color:var(--mut);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:500}
.act{display:flex;gap:10px;margin-top:auto;padding-top:14px}
.act button{flex:1;max-width:none;padding:14px;font-size:15px;font-weight:600}
.ag{background:transparent;border:1.5px solid var(--ln);color:var(--tx)}
.gt{background:var(--ink);color:var(--inv);border:0}
.hint{text-align:center;font-size:11px;color:var(--mut);margin-top:10px;letter-spacing:.4px}
.empty{margin:auto;text-align:center;color:var(--mut);padding:30px;line-height:1.7;font-family:Georgia,serif;font-size:17px}
#sheet{position:fixed;inset:0;background:#0009;display:none;align-items:flex-end;z-index:5}
#sheet.o{display:flex}#sheet>div{background:var(--card);width:100%;border-radius:26px 26px 0 0;padding:18px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:92%;overflow:auto}
#sheet h3{font-family:Georgia,serif;font-size:22px}
.f{display:block;width:100%;max-width:none;margin-bottom:8px;padding:11px 12px;border-radius:14px;background:var(--soft);color:var(--tx);border:1px solid var(--ln);font-size:14px}
h4{margin:14px 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut)}.row{display:flex;gap:8px}.row button{flex:1;max-width:none}
#log{font-size:13px;color:var(--mut);margin:6px 0;white-space:pre-wrap;max-height:130px;overflow:auto}
.on{background:var(--ink)!important;color:var(--inv)!important}
</style></head><body>
<div id="app">
<header><b>CA Shorts</b><span id="stk">● 0 today</span><select id="fd"></select><select id="fc"></select><button id="rv">🔁</button><button class="p" id="up">＋</button></header>
<div id="pgw"><div id="pg"></div></div>
<div id="feed"><div class="empty">Loading…</div></div>
</div>
<div id="sheet"><div>
<h3 style="margin:0 0 6px">Add today's current affairs</h3>
<input type="file" id="fi" accept=".pdf,.docx,.txt" multiple class="f">
<input type="date" id="dt" class="f">
<select id="im" class="f"><option value="info">Image: crop infographic from PDF page</option><option value="full">Image: full PDF page</option><option value="none">No images</option></select>
<textarea id="tx" class="f" rows="3" placeholder="…or paste text here"></textarea>
<div class="row"><button class="p" id="go">Make cards</button><button id="cl">Close</button></div>
<div id="log"></div>
<h4>AI settings (stored only on this device)</h4>
<select id="pv" class="f"><option value="gemini">Google Gemini (free key)</option><option value="anthropic">Anthropic Claude (paid key)</option></select>
<input id="ky" class="f" type="password" placeholder="API key" autocomplete="off">
<input id="md" class="f" placeholder="Model name">
<h4>Your data</h4>
<div class="row"><button id="ex">Export backup</button><button id="imp">Import backup</button></div>
<div class="row" style="margin-top:8px"><button id="del">Delete selected day</button></div>
<input type="file" id="bf" accept=".json" hidden>
</div></div>
<script>
const $=s=>document.querySelector(s);
const EM={Economy:'💹',Banking:'🏦',National:'🇮🇳',International:'🌍',Science:'🔬',Environment:'🌿',Defence:'🛡️',Sports:'🏏',Awards:'🏆',Appointments:'🧑‍💼',Days:'📅',State:'🗺️',Obituary:'🕊️',Other:'📌'};
const GR=['#3b4ba8,#6c8cff','#7a3ba8,#c06cff','#0f7a63,#38d39f','#a8573b,#ff9a6c','#3b7aa8,#6cd0ff','#a83b6a,#ff6c9d'];
const DEF={gemini:'gemini-2.5-flash-lite',anthropic:'claude-sonnet-5-5'};
/* ---------- storage: IndexedDB (docs + image blobs) ---------- */
const idb=new Promise((res,rej)=>{const r=indexedDB.open('cashorts',1);r.onupgradeneeded=()=>{r.result.createObjectStore('docs');r.result.createObjectStore('imgs')};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const put=(s,k,v)=>idb.then(d=>new Promise((res,rej)=>{const t=d.transaction(s,'readwrite');t.objectStore(s).put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error)}));
const del=(s,k)=>idb.then(d=>new Promise((res,rej)=>{const t=d.transaction(s,'readwrite');t.objectStore(s).delete(k);t.oncomplete=res;t.onerror=()=>rej(t.error)}));
const all=s=>idb.then(d=>new Promise((res,rej)=>{const o={},q=d.transaction(s).objectStore(s).openCursor();q.onsuccess=()=>{const c=q.result;if(c){o[c.key]=c.value;c.continue()}else res(o)};q.onerror=()=>rej(q.error)}));
let Q=[],docs={},urls={},revise=false,known={},cfg={};
try{known=JSON.parse(localStorage.getItem('known')||'{}');cfg=JSON.parse(localStorage.getItem('cfg')||'{}')}catch(e){}
const saveK=()=>localStorage.setItem('known',JSON.stringify(known));
const saveC=()=>localStorage.setItem('cfg',JSON.stringify(cfg));
async function load(){docs=await all('docs');const im=await all('imgs');Object.values(urls).forEach(URL.revokeObjectURL);urls={};for(const k in im)urls[k]=URL.createObjectURL(im[k]);render()}
/* ---------- UI ---------- */
$('#dt').value=new Date().toISOString().slice(0,10);
const esc=s=>{const d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML};
function render(){
  const vd=$('#fd').value,vc=$('#fc').value;let A=[];
  Object.entries(docs).forEach(([k,v])=>(v.cards||[]).forEach((c,i)=>A.push({...c,d:v.date,id:k+'#'+i})));
  A.sort((a,b)=>b.d<a.d?-1:b.d>a.d?1:0);
  const ds=[...new Set(A.map(c=>c.d))],cats=[...new Set(A.map(c=>c.cat))].sort();
  $('#fd').innerHTML='<option value="">All days</option>'+ds.map(d=>`<option ${d==vd?'selected':''}>${d}</option>`).join('');
  $('#fc').innerHTML='<option value="">All topics</option>'+cats.map(c=>`<option ${c==vc?'selected':''}>${esc(c)}</option>`).join('');
  let L=A.filter(c=>(!vd||c.d==vd)&&(!vc||c.cat==vc));
  if(revise){L=L.filter(c=>!known[c.id]);L.sort(()=>Math.random()-.5)}
  const f=$('#feed');
  if(!L.length){f.innerHTML=`<div class="empty">${A.length?'Nothing left to revise 🎉':'No cards yet.<br>Tap <b>＋</b>, add your AI key, then select today’s PDFs.'}</div>`;return}
  f.innerHTML=L.map((c,i)=>`<div class="c" data-id="${c.id}"><div class="in">
  <div class="im" style="--g:${GR[(c.title||'').length%GR.length]}">${c.img&&urls[c.img]?`<img src="${urls[c.img]}" alt="">`:(EM[c.cat]||'📌')}<div class="tag">${EM[c.cat]||'📌'} ${esc(c.cat)}</div><div class="n">${i+1} / ${L.length}</div></div>
  <div class="bd"><h2>${esc(c.title)}</h2><div class="mt">${c.d}</div><p>${esc(c.summary)}</p>
  <button class="rev" data-r="1">Reveal key facts</button>
  <div class="facts" hidden><ul>${(c.facts||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul><div class="kw">${(c.keywords||[]).map(k=>`<span>#${esc(k)}</span>`).join('')}</div></div>
  <div class="act"><button class="ag" data-a="again">Again</button><button class="gt ${known[c.id]?'on':''}" data-a="got">${known[c.id]?'✓ Got it':'Got it'}</button></div>
  <div class="hint">Swipe up ⌃</div></div></div></div>`).join('');
  prog();
}
function today(){return new Date().toISOString().slice(0,10)}
let st={};try{st=JSON.parse(localStorage.getItem('st')||'{}')}catch(e){}
function stk(){if(st.d!=today())st={d:today(),n:0};$('#stk').textContent='● '+st.n+' today'}
function prog(){const f=$('#feed'),m=f.scrollHeight-f.clientHeight;$('#pg').style.width=(m>0?f.scrollTop/m*100:0)+'%'}
$('#feed').addEventListener('scroll',prog);
$('#feed').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;const card=b.closest('.c');if(!card)return;
  if(b.dataset.r){const fc=card.querySelector('.facts');fc.hidden=false;b.hidden=true;return}
  if(b.dataset.a){const id=card.dataset.id;
    if(b.dataset.a=='got'){if(!known[id]){stk();st.n++;localStorage.setItem('st',JSON.stringify(st));stk()}known[id]=1;b.classList.add('on');b.textContent='✓ Got it'}
    else{delete known[id]}
    saveK();const nx=card.nextElementSibling;if(nx)setTimeout(()=>nx.scrollIntoView({behavior:'smooth'}),180)}
});
stk();
['fd','fc'].forEach(i=>$('#'+i).onchange=render);
$('#rv').onclick=()=>{revise=!revise;$('#rv').classList.toggle('on',revise);render()};
$('#fi').onchange=()=>{for(const f of $('#fi').files)if(!Q.some(q=>q.name==f.name&&q.size==f.size))Q.push(f);$('#fi').value='';showQ()};
function showQ(){log(Q.length?'Queued ('+Q.length+'):\n'+Q.map((f,i)=>(i+1)+'. '+f.name).join('\n')+'\nTap “Choose files” again to add more.':'')}
$('#up').onclick=()=>$('#sheet').classList.add('o');$('#cl').onclick=()=>$('#sheet').classList.remove('o');
const log=(m,add)=>{const l=$('#log');l.textContent=add?l.textContent+'\n'+m:m;l.scrollTop=1e6};
/* settings */
$('#pv').value=cfg.pv||'gemini';$('#ky').value=cfg.ky||'';$('#md').value=cfg.md||'';$('#md').placeholder='Model (default '+DEF[$('#pv').value]+')';
$('#pv').onchange=()=>{cfg.pv=$('#pv').value;$('#md').placeholder='Model (default '+DEF[cfg.pv]+')';saveC()};
$('#ky').onchange=()=>{cfg.ky=$('#ky').value.trim();saveC()};$('#md').onchange=()=>{cfg.md=$('#md').value.trim();saveC()};
/* ---------- AI ---------- */
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function ask(prompt){
  const pv=cfg.pv||'gemini';let model=cfg.md||DEF[pv];if(!cfg.ky)throw new Error('Add your API key in AI settings');
  for(let a=0;a<4;a++){
    let r,txt;
    if(pv=='gemini'){
      r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(cfg.ky)}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{responseMimeType:'application/json',temperature:.2}})});
    }else{
      r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':cfg.ky,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model,max_tokens:8000,messages:[{role:'user',content:prompt}]})});
    }
    if(r.status==429||r.status==503){log('  waiting (rate limit)…',1);await sleep(9000*(a+1));continue}
    const j=await r.json();
    if(!r.ok){const msg=(j.error&&(j.error.message||j.error))||String(r.status);
      /* Google retires models: if the error names a replacement, switch to it, remember it, and retry */
      const m=pv=='gemini'&&String(msg).match(/use (?:models\/)?(gemini-[\w.-]+)/i);
      if(m&&m[1]!==model){log('  model '+model+' retired, switching to '+m[1],1);model=m[1];cfg.md=model;saveC();$('#md').value=model;a--;continue}
      throw new Error(msg)}
    txt=pv=='gemini'?j.candidates[0].content.parts.map(p=>p.text||'').join(''):j.content.map(p=>p.text||'').join('');
    const s=txt.indexOf('['),e=txt.lastIndexOf(']');return JSON.parse(txt.slice(s,e+1));
  }
  throw new Error('Rate limited, try again in a minute');
}
const PROMPT=`You convert current-affairs study material into swipeable flashcards for an Indian banking/civil-services aspirant (RBI Grade B, UPSC). Text contains markers like [[PAGE 5]]. Make one card per distinct news item. Skip ads, promos, quiz banners, hiring and legal notices, table of contents. Return ONLY a JSON array. Item: {"page": number of the [[PAGE n]] marker the item appears under (null if unknown), "cat": one of Economy|Banking|National|International|Science|Environment|Defence|Sports|Awards|Appointments|Days|State|Obituary|Other, "title": short headline, "summary": 2 crisp sentences, "facts": 4-7 exam facts as short strings (who, what, where, when, numbers, ministry, HQ, scheme, report/index, previous holder), "keywords": 3-5 short tags}. Never invent facts that are not in the text. Text:\n\n`;
/* ---------- files ---------- */
async function readFile(f){
  const n=f.name.toLowerCase();
  if(n.endsWith('.pdf')){
    pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise,pages=[];
    for(let i=1;i<=pdf.numPages;i++){const t=await(await pdf.getPage(i)).getTextContent();pages.push(t.items.map(x=>x.str).join(' '));if(i%8==0)log(`  reading page ${i}/${pdf.numPages}`,1)}
    return{pages,pdf};
  }
  if(n.endsWith('.docx')){return{pages:[(await mammoth.extractRawText({arrayBuffer:await f.arrayBuffer()})).value]}}
  return{pages:[await f.text()]};
}
function chunks(pages,max=8000){const o=[];let c='';pages.forEach((t,i)=>{const s=`[[PAGE ${i+1}]]\n${t.slice(0,max)}\n`;if(c.length+s.length>max&&c){o.push(c);c=''}c+=s});if(c)o.push(c);return o}
async function pageImg(pdf,n,mode){
  const pg=await pdf.getPage(n),sc=1000/pg.getViewport({scale:1}).width,v=pg.getViewport({scale:sc});
  const cv=document.createElement('canvas');cv.width=v.width;cv.height=v.height;
  await pg.render({canvasContext:cv.getContext('2d'),viewport:v}).promise;let o=cv;
  if(mode=='info'){const l=.113*cv.width,r=.125*cv.width,t=.12*cv.height,b=.072*cv.height;o=document.createElement('canvas');o.width=cv.width-l-r;o.height=cv.height-t-b;o.getContext('2d').drawImage(cv,l,t,o.width,o.height,0,0,o.width,o.height)}
  const blob=await new Promise(r=>o.toBlob(r,'image/jpeg',.72));
  const id='i'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);await put('imgs',id,blob);return id;
}
$('#go').onclick=async()=>{
  const btn=$('#go');btn.disabled=true;
  try{
    const mode=$('#im').value,d=$('#dt').value,files=[...Q],pasted=$('#tx').value.trim();
    if(!files.length&&pasted.length<200){log('Select files or paste more text.');return}
    if(!cfg.ky){log('Add your API key under AI settings first.');return}
    log('');const jobs=files.map(f=>({name:f.name,f}));if(pasted.length>=200)jobs.push({name:'pasted',text:pasted});let total=0;
    for(const j of jobs){
      log('📄 '+j.name,1);const r=j.f?await readFile(j.f):{pages:[j.text]};let cards=[];const cs=chunks(r.pages);
      for(let i=0;i<cs.length;i++){log(`  writing cards ${i+1}/${cs.length}`,1);try{const a=await ask(PROMPT+cs[i]);if(Array.isArray(a))cards=cards.concat(a)}catch(e){log('  failed: '+e.message,1)}}
      const seen=new Set();cards=cards.filter(c=>c&&c.title&&!seen.has(c.title.toLowerCase())&&seen.add(c.title.toLowerCase()));
      if(r.pdf&&mode!='none'){const pm={};for(const c of cards){const p=Number(c.page);if(p>=1&&p<=r.pages.length){if(!(p in pm)){log('  image p.'+p,1);try{pm[p]=await pageImg(r.pdf,p,mode)}catch(e){pm[p]=null}}c.img=pm[p]||undefined}}}
      cards.forEach(c=>{if(!c.img)delete c.img;if(c.page==null)delete c.page});
      if(!cards.length){log('  no cards',1);continue}
      const id=(d+'-'+j.name.replace(/\.[^.]+$/,'').replace(/[^A-Za-z0-9_-]/g,'_')).slice(0,120);
      await put('docs',id,{date:d,file:j.name,cards});total+=cards.length;log(`  ✅ ${cards.length} cards saved`,1);await load();
    }
    log(`Done — ${total} cards.`,1);$('#tx').value='';Q=[];
  }catch(e){log('Error: '+(e.message||e),1)}finally{btn.disabled=false}
};
/* ---------- backup / delete ---------- */
const b2d=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});
$('#ex').onclick=async()=>{
  const im=await all('imgs'),out={docs:await all('docs'),imgs:{},known};
  for(const k in im)out.imgs[k]=await b2d(im[k]);
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(out)],{type:'application/json'}));a.download='ca-shorts-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();
};
$('#imp').onclick=()=>$('#bf').click();
$('#bf').onchange=async e=>{
  try{const j=JSON.parse(await e.target.files[0].text());
    for(const k in j.docs)await put('docs',k,j.docs[k]);
    for(const k in j.imgs)await put('imgs',k,await(await fetch(j.imgs[k])).blob());
    Object.assign(known,j.known||{});saveK();await load();log('Backup imported ✅')}catch(x){log('Import failed: '+x.message)}
};
$('#del').onclick=async()=>{
  const d=$('#fd').value;if(!d){log('Choose a day in the top filter first.');return}
  if(!confirm('Delete all cards for '+d+'?'))return;
  for(const [k,v] of Object.entries(docs))if(v.date==d){for(const c of v.cards)if(c.img)await del('imgs',c.img);await del('docs',k)}
  $('#fd').value='';await load();
};
if(navigator.storage&&navigator.storagepersist)navigator.storage.persist();
load().catch(e=>{$('#feed').innerHTML='<div class="empty">Storage unavailable: '+esc(e.message)+'<br>Turn off Private Browsing.</div>'});
</script></body></html>
